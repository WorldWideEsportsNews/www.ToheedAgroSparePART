<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tohid Agro Spare Parts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #262a2e;
      color: #f1f3f5;
      line-height: 1.6;
      padding: 24px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background-color: #343a40;
      border: 1px solid #5c636a;
      border-radius: 10px;
      overflow: hidden;
    }
    .header {
      background-color: #1f2327;
      padding: 28px 24px;
      border-bottom: 1px solid #5c636a;
    }
    .header h1 {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .header p {
      color: #ced4da;
      font-size: 15px;
    }
    .content {
      padding: 24px;
    }
    .card {
      background-color: #495057;
      border: 1px solid #6c757d;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card:last-child {
      margin-bottom: 0;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #dee2e6;
      margin-bottom: 4px;
    }
    .value {
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      word-break: break-word;
    }
    .phone-link {
      color: #ffffff;
      text-decoration: underline;
    }
    .footer {
      background-color: #1f2327;
      color: #adb5bd;
      text-align: center;
      font-size: 13px;
      padding: 14px 20px;
      border-top: 1px solid #5c636a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tohid Agro Spare Parts</h1>
      <p>Agricultural Spare Parts &amp; Equipment</p>
    </div>

    <div class="content">
      <div class="card">
        <div class="label">Address</div>
        <div class="value">Mohalla Rajpura, Tohid Agro, Mor Kunda</div>
      </div>

      <div class="card">
        <div class="label">GPS Coordinates</div>
        <div class="value">31.316607218729114, 73.79468590007981</div>
      </div>

      <div class="card">
        <div class="label">Owner Contact Number</div>
        <div class="value">
          <a class="phone-link" href="tel:03334246467">03334246467</a>
        </div>
      </div>
    </div>

    <div class="footer">
      Tohid Agro Spare Parts &bull; Mohalla Rajpura, Tohid Agro, Mor Kunda
    </div>
  </div>
</body>
</html>
